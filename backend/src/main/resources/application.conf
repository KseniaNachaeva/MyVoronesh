ktor {
  deployment {
    port = 8080
    host = "0.0.0.0"
  }
  application {
    modules = [ ApplicationKt.module ]
  }
}

# Настройки приложения.
# Эти значения используются как fallback, если не заданы переменные окружения:
#   BASE_URL   — переопределяет app.baseUrl
#   UPLOAD_DIR — переопределяет путь к папке uploads (по умолчанию ./uploads рядом с JAR)
#   DB_URL     — переопределяет database.url
#   DB_USER    — переопределяет database.user
#   DB_PASSWORD — переопределяет database.password
app {
  baseUrl = "http://10.0.2.2:8080"
}

database {
  url = "jdbc:mysql://localhost:3306/MyVoronesh?useSSL=false&serverTimezone=UTC"
  user = "root"
  password = "mysql"
}